services:
  db:
    image: postgres:16-alpine
    container_name: smart-recharge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smart_recharge
    ports:
      - "5432:5432"
    volumes:
      - smart_recharge_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart_recharge"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  smart_recharge_data:
